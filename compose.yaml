services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/maintenance.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - maintenance-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  maintenance-data:
